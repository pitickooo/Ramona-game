<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOVE BOY ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="console">

    <div class="screen" id="screen">

        <div id="bootScreen">

            <div class="bootLogo">
                LOVE BOY ❤️
            </div>

            <div class="bootText">
                Retro Edition v1.0
            </div>

            <br>

            <div id="loadingText">
                Loading...
            </div>

            <div class="loadingBar">
                <div id="loadingFill"></div>
            </div>

        </div>

        <div id="menuScreen" style="display:none;">

            <h1>LOVE BOY ❤️</h1>
            <p class="version">Retro Edition v1.0</p>

            <div class="line"></div>

            <ul id="menu">
                <li class="selected">► START</li>
                <li>OUR STORY</li>
                <li>MEMORIES</li>
                <li>LOVE LETTER</li>
                <li>CREDITS</li>
            </ul>

        </div>

        <div id="pageScreen" style="display:none;">

            <h2 id="pageTitle"></h2>

            <p id="pageText"></p>

        </div>

    </div>

</div>

<!-- OVLÁDÁNÍ PRO MOBIL -->

<div id="controls">

    <button id="up">▲</button>

    <div class="middleButtons">
        <button id="back">◀</button>
        <button id="ok">OK</button>
        <button id="right">▶</button>
    </div>

    <button id="down">▼</button>

</div>

<script src="script.js"></script>

</body>
</html>
